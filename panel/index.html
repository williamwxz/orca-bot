<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot Deck</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Bot Deck</h1>
      <section id="running" aria-label="Chat and bots" hidden>
        <button id="open" type="button">Open chat</button>
        <button id="sign-in" type="button">Sign in again</button>
        <p id="result" role="status" aria-live="polite"></p>
        <div id="roster" aria-label="Bots"></div>
        <p id="refresh-note" role="status"></p>
        <button id="new-bot" type="button">New bot</button>
      </section>
      <p id="message" role="status">Checking status…</p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
