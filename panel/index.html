<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot Deck</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" data-view="list">
      <aside id="list" aria-label="Grok Bots">
        <header class="bar list-bar">
          <span class="spacer"></span>
          <button id="search-bots" class="icon" type="button" title="Search bots" aria-label="Search bots" aria-expanded="false" aria-controls="bot-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button>
          <button id="new-bot" class="icon" title="New bot" aria-label="New bot">+</button>
        </header>
        <div id="search-field" hidden><input id="bot-search" type="search" placeholder="Search bots" aria-label="Filter bots by name" autocomplete="off" /></div>
        <div id="bots" aria-label="Grok Bots"></div>
      </aside>

      <main id="chat">
        <header class="bar">
          <button id="back" class="icon narrow-only" title="All bots" aria-label="All bots">‹</button>
          <span id="chat-avatar"></span>
          <strong id="chat-title"></strong>
          <span class="spacer"></span>
          <button id="open-info" class="icon" title="Bot details" aria-label="Bot details">⋯</button>
        </header>
        <div id="messages" aria-live="polite"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
          <button id="send" type="submit" class="primary" title="Send" aria-label="Send">↑</button>
        </form>
      </main>

      <aside id="info" aria-label="Bot details">
        <header class="bar">
          <button id="close-info" class="icon" title="Close details" aria-label="Close details">✕</button>
          <strong>Details</strong>
        </header>
        <div id="info-body"></div>
      </aside>

      <section id="empty"></section>
    </div>
    <div id="modal" hidden></div>
    <script type="module" src="app.ts"></script>
  </body>
</html>
