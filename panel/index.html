<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Team for Orca</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div id="main-view">
      <div id="sidebar">
        <header>
          <div id="list-header">
            <h1 id="list-title">Bots</h1>
          </div>
          <select id="host" aria-label="Bots run on" hidden></select>
          <p id="message" role="status">Connecting to Hermes…</p>
        </header>
        <section id="running" aria-label="Bots" hidden>
          <div id="roster" aria-label="Bots"></div>
        </section>
        <button id="retry" type="button" hidden>Retry</button>
      </div>
      <section id="bot-view" aria-label="Bot conversation" hidden></section>
      <div id="chat-empty"><p>Choose a bot to start chatting.</p></div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script type="module" src="app.ts"></script>
</body>
</html>
