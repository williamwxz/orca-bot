<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Deck</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><div id="list-header"><h1 id="list-title">Bot Deck</h1><button id="open-page" type="button" disabled>Open OpenMausBot</button></div><p id="message" role="status">Starting…</p></header>
    <section id="setup" aria-label="Set up Bot Deck" hidden>
      <h2>Set up Bot Deck</h2>
      <label><input id="share-tools" type="checkbox" checked /> <strong>Bots can use my tools</strong> — Claude bots get your Claude connectors, MCP servers, skills and instructions. Codex bots always use your Codex setup.</label>
      <label id="link-agents-label"><input id="link-agents" type="checkbox" checked /> <strong>My Orca agents can talk to the bots</strong> — Adds Bot Deck's tools to <span id="agent-names">Claude and Codex</span>, so an agent can message a bot or read its replies.</label>
      <button id="setup-allow" type="button">Allow</button>
      <button id="setup-skip" type="button">Not now</button>
      <p id="setup-message" role="status"></p>
    </section>
    <section id="running" aria-label="Chat and bots" hidden>
      <div id="roster-view">
      <div id="roster" aria-label="Bots"></div>
      <p id="refresh-note" role="status"></p>
      </div>
      <section id="bot-view" aria-label="Bot conversation" hidden></section>
      <p id="result" role="status" aria-live="polite"></p>
    </section>
    <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script type="module" src="app.ts"></script>
</body>
</html>
